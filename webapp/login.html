<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Placement Training System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page login-page admin-auth-page" data-login-role="ADMIN">
    <div class="admin-auth-layout">
        <header class="admin-auth-header">
            <a class="admin-auth-brand" href="/" aria-label="Placement Training System home">
                <span class="admin-auth-mark" aria-hidden="true"><i class="fas fa-shield-halved"></i></span>
                <span class="admin-auth-brand-copy"><small>PLACEMENT TRAINING</small><strong>PT System</strong></span>
            </a>
            <span class="admin-auth-badge"><i class="fas fa-lock" aria-hidden="true"></i> ADMIN CONSOLE</span>
        </header>
        <main class="admin-auth-main">
            <section class="login-panel admin-auth-panel" aria-labelledby="loginTitle">
                <p class="admin-auth-eyebrow">ADMINISTRATOR ACCESS</p>
                <h1 id="loginTitle">Sign in to your console</h1>
                <p class="login-copy">Use your administrator account to continue.</p>
            <form class="form" id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                    <button type="submit" id="loginSubmit" class="btn btn-primary w-100">Sign in <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
            </form>
                <p class="login-help">Need admin access? Contact your system administrator.</p>
                <p class="student-login-link">Student account? <a href="/webapp/student/login.html">Go to student sign-in</a></p>
            </section>
        </main>
        <footer class="admin-auth-footer">PT System <span aria-hidden="true">/</span> Administrator sign-in</footer>
    </div>
    
    <script src="/js/snackbar.js"></script>
    <script src="/js/csrf.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
