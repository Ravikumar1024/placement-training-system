<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Placement System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="center">
    <div class="card">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Placement System</h1>
            <p class="text-muted">Student placement training & tracking system</p>
        </div>
        
        <form class="form" id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
            
            <div id="msg" class="alert alert-danger d-none mt-3"></div>
            <p class="text-center mt-3">
                <small class="text-muted">Demo: admin/admin123 or student/student123</small>
            </p>
        </form>
    </div>
    
    <script src="/js/csrf.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
