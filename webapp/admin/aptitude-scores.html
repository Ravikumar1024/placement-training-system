<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Scores | Placement Training System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
    <main class="container-fluid admin-workspace py-4">
        <header class="admin-page-heading"><div><p class="admin-eyebrow">ADMINISTRATION / ASSESSMENT</p><h1>Aptitude scores</h1><p class="admin-heading-copy">Record verified percentages and review student results.</p></div><a class="btn btn-outline-secondary" href="/webapp/admin/dashboard.html">Back to dashboard</a></header>
        <output id="scoreMessage" class="alert d-none" aria-live="polite"></output>
        <section class="card admin-list-panel mb-4">
            <div class="card-header"><h2 class="h5 mb-0" id="scoreFormHeading">Record a score</h2></div>
            <div class="card-body">
                <form id="scoreForm" class="row g-3 align-items-end">
                    <div class="col-md-4"><label class="form-label" for="scoreStudent">Student</label><select class="form-select" id="scoreStudent" required></select></div>
                    <div class="col-md-4"><label class="form-label" for="scoreTest">Test</label><select class="form-select" id="scoreTest" required></select></div>
                    <div class="col-md-2"><label class="form-label" for="scoreValue">Score (%)</label><input class="form-control" id="scoreValue" type="number" min="0" max="100" step="0.01" required></div>
                    <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary" id="saveScore" type="submit">Save score</button><button class="btn btn-outline-secondary" id="cancelScoreEdit" type="button" hidden>Cancel</button></div>
                </form>
            </div>
        </section>
        <section class="card admin-list-panel">
            <div class="card-header"><h2 class="h5 mb-0">Score history</h2></div>
            <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Student</th><th>Test</th><th>Date</th><th>Result</th><th>Actions</th></tr></thead><tbody id="scoreRows"></tbody></table></div>
        </section>
    </main>
    <script src="/js/csrf.js"></script>
    <script src="/js/admin-aptitude-scores.js"></script>
</body>
</html>
