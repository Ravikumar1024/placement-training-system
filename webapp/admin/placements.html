<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Placements</title><link rel="stylesheet" href="/css/style.css"></head>
<body><nav><b>Placements</b><a href="/webapp/admin/dashboard.html">Dashboard</a></nav><main>
<h1>Placements</h1>
<form class="card form" id="placementForm">
  <input id="studentId" type="number" placeholder="Student ID" required>
  <input id="companyId" type="number" placeholder="Company ID" required>
  <select id="status" required>
    <option value="APPLIED">Applied</option><option value="APTITUDE_CLEARED">Aptitude Cleared</option><option value="TECHNICAL_ROUND">Technical Round</option><option value="HR_ROUND">HR Round</option><option value="SELECTED">Selected</option><option value="REJECTED">Rejected</option>
  </select>
  <input id="appliedDate" type="date" required>
  <input id="placementDate" type="date">
  <button class="btn" type="submit">Add Placement</button>
</form>
<div class="card"><table><thead><tr><th>ID</th><th>Student</th><th>Company</th><th>Status</th><th>Applied Date</th><th>Placement Date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="/js/snackbar.js"></script>
<script>
const rows = document.getElementById('rows');
const form = document.getElementById('placementForm');
const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
async function load(){
  const r=await fetch('/api/placements');
  const data=await r.json();
  if(!r.ok){window.showSnackbar(data);return;}
  const placements=data.data ?? data;
  rows.innerHTML=placements.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.student?.id ?? '')}</td><td>${esc(p.company?.companyName)}</td><td>${esc(p.status)}</td><td>${esc(p.appliedDate ?? '')}</td><td>${esc(p.placementDate ?? '')}</td><td><button type="button" onclick="del('${esc(p.id)}')">Delete</button></td></tr>`).join('');
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const body={studentId:Number(studentId.value),companyId:Number(companyId.value),status:status.value,appliedDate:appliedDate.value,placementDate:placementDate.value||null};
  const r=await fetch('/api/placements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const result=await r.json();
  if(!r.ok){window.showSnackbar(result);return;}
  form.reset(); window.showSnackbar(result); load();
});
async function del(id){if(confirm('Delete this placement?')){const r=await fetch('/api/placements/'+encodeURIComponent(id),{method:'DELETE'});const result=await r.json();if(!r.ok){window.showSnackbar(result);return;}window.showSnackbar(result);load();}}
load();
</script></body></html>
